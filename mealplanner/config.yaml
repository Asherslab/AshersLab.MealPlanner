# The Home Assistant add-on. Reference: https://developers.home-assistant.io/docs/add-ons/configuration
# Why it looks like this: docs/modules/infrastructure/deployment.md.

name: Meal Planner
description: Plan the household's meals, the shopping list and what it all costs.
slug: mealplanner
url: https://github.com/Asherslab/AshersLab.MealPlanner

# Written by CI (.github/workflows/docker-publish.yml) AFTER the image with this tag is pushed - that commit is
# what makes Home Assistant offer the update. Never edit by hand: a version with no image fails to install.
version: "0.0.51"

# One multi-arch manifest, pulled by platform; no {arch} in the name.
image: ghcr.io/asherslab/asherslab-mealplanner
arch:
  - aarch64
  - amd64

startup: application
boot: auto

# Reached at its own HTTPS address through Nginx Proxy Manager - which does HTTPS and nothing else - so it can be
# installed on a phone and opened with no signal. Not through Home Assistant's sidebar: an app in Home Assistant's
# frame can be neither (docs/modules/sync/offline-sync.md#where-offline-works). The proxy reaches it on Home Assistant's
# internal add-on network, on 8099; nothing is published on the host unless the owner sets a port on the Network tab.
ingress: false
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Only for a proxy on another machine. Leave empty for Nginx Proxy Manager on this Home Assistant.

# The app signs people in itself, with passkeys (AshersLab.MealPlanner.Grpc/Features/Accounts): every sync call needs a
# signed-in member. In the environment, not an option: nothing on the Configuration tab can turn sign-in off.
environment:
  Auth__Mode: Accounts

# Hot backups that are still consistent. The live SQLite file copied mid-write, or without the -wal holding its
# newest commits, can be unusable; so before each hot backup the app writes a self-contained copy with VACUUM INTO
# (/data/mealplanner.snapshot.db), the live files are left out, and a restore starts from the copy
# (AshersLab.MealPlanner.Grpc/Data/DatabaseSnapshot.cs). The Supervisor matches each exclude against the end of the
# path, so these never match the snapshot. If the command fails, the backup fails - it never silently backs up nothing.
backup: hot
backup_pre: dotnet /app/AshersLab.MealPlanner.Grpc.dll snapshot
backup_exclude:
  - mealplanner.db
  - mealplanner.db-wal
  - mealplanner.db-shm
  - mealplanner.snapshot.db.partial

# The Configuration tab, read from /data/options.json (Grpc/Features/Auth/AddOnOptions.cs). public_url: the address
# people open - passkeys are bound to it, so it must not change once anyone has one; empty, the add-on does not start
# and its log says why. reset_access: prints a new setup link at start, for when nobody can sign in; turn it off again.
options:
  public_url: ""
  reset_access: false
schema:
  public_url: str
  reset_access: bool
