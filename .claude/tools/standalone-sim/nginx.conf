# Stands in for a sign-in proxy (oauth2-proxy, Authentik) in front of the standalone image: every request here is a
# signed-in user, named in the headers the app is configured to believe (Auth__UserHeader, Auth__DisplayNameHeader).
# proxy_set_header REPLACES the browser's own copy of each - what a real proxy must do, and what the app relies on.
events {}

http {
    server {
        listen 8080;

        location / {
            proxy_pass http://mealplanner:8099;
            proxy_http_version 1.1;
            # The change stream is one long response: unbuffered, and not cut off.
            proxy_buffering off;
            proxy_read_timeout 1h;

            proxy_set_header X-Forwarded-User                planner@example.com;
            proxy_set_header X-Forwarded-Preferred-Username  "The Planner";
        }
    }
}
