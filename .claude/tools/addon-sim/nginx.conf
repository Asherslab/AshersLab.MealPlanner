# Nginx Proxy Manager as the add-on's DOCS.md sets it up, in plain nginx: a proxy host forwarding to the add-on, with
# the optional Advanced tab. It does nothing about who is asking - the app signs people in itself.
# :8080 is http://localhost:18410 from the Mac (localhost is a secure context, so passkeys and the service worker work).
events {}

http {
    server {
        listen 8080;

        location / {
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;

            # DOCS.md's optional Advanced tab.
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_connect_timeout 5s;

            proxy_pass http://172.30.33.10:8099;
        }
    }
}
