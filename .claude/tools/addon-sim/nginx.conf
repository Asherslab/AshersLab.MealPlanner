# Nginx Proxy Manager and Authelia, as the add-on's DOCS.md sets them up - on this machine, in plain nginx.
#
# :8080 is the proxy host (http://localhost:18410 from the Mac): the location blocks are DOCS.md's Advanced tab, with
# Authelia's auth-request answered by a stub that reads a cookie. :8081 is "Authelia's" login page
# (http://localhost:18411) - another origin, as the real one is another domain: its Sign in sets the cookie and goes back.
# Cookies ignore the port, so the cookie set by :8081 reaches :8080.
events {}

http {
    server {
        listen 8080;

        # DOCS.md's auth-request location, pointed at the stub (:8082) instead of Authelia.
        location /internal/authelia/authz {
            internal;
            proxy_pass http://127.0.0.1:8082/api/authz/auth-request;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Content-Length "";
            proxy_set_header Connection "";
            proxy_pass_request_body off;
        }

        # From here to the end of @signin: DOCS.md's Advanced tab, the proxy_pass pointed at the app.
        location / {
            auth_request /internal/authelia/authz;
            auth_request_set $user $upstream_http_remote_user;
            auth_request_set $name $upstream_http_remote_name;
            auth_request_set $redirection_url $upstream_http_location;
            error_page 401 = @signin;

            proxy_set_header X-Forwarded-User $user;
            proxy_set_header X-Forwarded-Name $name;

            proxy_connect_timeout 5s;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_http_version 1.1;
            proxy_pass http://172.30.33.10:8099;
        }

        location @signin {
            if ($http_content_type ~* "grpc-web") { return 401; }
            # Authelia names its login page in Location; the stub has no Location, so the login is fixed here.
            return 302 http://localhost:18411/?rd=http://localhost:18410$request_uri;
        }
    }

    # The stub for Authelia's /api/authz/auth-request: signed in is a "session" cookie; its value is the user, handed back
    # as Remote-User and Remote-Name like Authelia does. A browser's own X-Forwarded-User never gets this far.
    server {
        listen 127.0.0.1:8082;
        location = /api/authz/auth-request {
            if ($cookie_session = "") { return 401; }
            add_header Remote-User $cookie_session always;
            add_header Remote-Name "The Planner" always;
            return 200;
        }
    }

    server {
        listen 8081;
        location = / {
            default_type text/html;
            return 200 '<!doctype html><title>Sign in</title><a id="signin" href="/signin">Sign in</a>';
        }
        location = /signin {
            add_header Set-Cookie "session=planner; Path=/; Max-Age=86400; SameSite=Lax";
            return 302 http://localhost:18410/;
        }
    }
}
