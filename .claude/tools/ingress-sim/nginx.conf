# Stands in for the Home Assistant Supervisor's ingress proxy in front of the add-on image. What it copies from
# the real one (supervisor/api/ingress.py): it strips /api/hassio_ingress/<token>, forwards over HTTP/1.1 to the
# add-on's ingress_port, adds X-Ingress-Path and the X-Remote-User-* headers, and streams responses unbuffered.
# What it does not: Home Assistant login - every request here is the fake user below.
events {}

http {
    server {
        listen 8080;

        location = /api/hassio_ingress/sImUlAtEdToKeN {
            return 301 /api/hassio_ingress/sImUlAtEdToKeN/;
        }

        location /api/hassio_ingress/sImUlAtEdToKeN/ {
            proxy_pass http://mealplanner:8099/;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 1h;

            proxy_set_header X-Ingress-Path              /api/hassio_ingress/sImUlAtEdToKeN;
            proxy_set_header X-Remote-User-Id            0f1e2d3c4b5a69788796a5b4c3d2e1f0;
            proxy_set_header X-Remote-User-Name          planner;
            proxy_set_header X-Remote-User-Display-Name  "The Planner";
        }
    }
}
