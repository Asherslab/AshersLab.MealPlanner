<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>Meal Planner</title>
    <!--
        Rewritten per request. Under Home Assistant ingress the app lives at /api/hassio_ingress/<token>/, and
        the host replaces this exact line from X-Ingress-Path (Grpc/Features/Ingress/AppShell.cs - change one,
        change both; a test fails if they drift). Nothing else in the app may assume "/".
    -->
    <base href="/"/>
    <!--
        No web font link, unlike the MudBlazor template. The shopping list is used in a shop with poor
        reception, so the app makes no third-party request: its fonts are self-hosted under fonts/ and
        declared in css/app.css.
    -->
    <!--
        Installable: relative to <base href> like everything else, so it works at "/" and under an ingress path. An
        install only means anything at the app's own HTTPS address - inside Home Assistant's frame the browser installs
        Home Assistant, not this (docs/modules/sync/offline-sync.md#where-offline-works).
    -->
    <link rel="manifest" href="manifest.webmanifest"/>
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml"/>
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
    <meta name="theme-color" content="#2F5D50"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-title" content="Meals"/>
    <!-- Light or dark, from this device's copy of the planner's choice: set before the stylesheets paint. -->
    <script src="js/appearance.js"></script>
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet"/>
    <link href="css/app.css" rel="stylesheet"/>
    <link href="AshersLab.MealPlanner.WASM.styles.css" rel="stylesheet"/>
</head>

<body>
<div id="app">
    <!--
        The splash while the runtime downloads and starts; Blazor replaces it on first render. The icon is drawn inline
        (icons/icon.svg without its square) so it paints with the HTML, before any other request. The bar follows the
        download through --blazor-load-percentage, which Blazor sets on <html>.
    -->
    <div class="boot" role="status" aria-label="Loading Meal Planner">
        <div class="boot-tile">
            <svg viewBox="0 0 512 512" aria-hidden="true">
                <rect x="124" y="118" width="264" height="292" rx="18" fill="#FBFBF6"/>
                <rect x="124" y="118" width="264" height="70" rx="18" fill="#DDE9DF"/>
                <rect x="124" y="160" width="264" height="28" fill="#DDE9DF"/>
                <g fill="#2F5D50">
                    <circle cx="146" cy="118" r="7"/><circle cx="176" cy="118" r="7"/><circle cx="206" cy="118" r="7"/><circle cx="236" cy="118" r="7"/>
                    <circle cx="266" cy="118" r="7"/><circle cx="296" cy="118" r="7"/><circle cx="326" cy="118" r="7"/><circle cx="356" cy="118" r="7"/>
                </g>
                <rect x="152" y="226" width="150" height="14" rx="7" fill="#1D2B27"/>
                <rect x="152" y="282" width="196" height="14" rx="7" fill="#1D2B27" opacity="0.55"/>
                <rect x="152" y="338" width="122" height="14" rx="7" fill="#1D2B27" opacity="0.55"/>
                <path class="boot-strike" d="M150 254 C 200 246, 260 250, 314 244" stroke="#D9533C" stroke-width="10" stroke-linecap="round" fill="none" pathLength="1"/>
                <g class="boot-magnet">
                    <circle cx="352" cy="154" r="34" fill="#D9533C"/>
                    <circle cx="352" cy="148" r="34" fill="#E46A55"/>
                </g>
            </svg>
        </div>
        <div class="boot-name">Meal Planner</div>
        <div class="boot-bar"><span></span></div>
    </div>
</div>

<div id="blazor-error-ui">
    An unhandled error has occurred.
    <a href="." class="reload">Reload</a>
    <span class="dismiss">x</span>
</div>

<!-- Plain name, no fingerprint marker - see OverrideHtmlAssetPlaceholders in the csproj. -->
<script src="_framework/blazor.webassembly.js"></script>
<script src="_content/MudBlazor/MudBlazor.min.js"></script>
<script src="js/app-update.js"></script>
<script>mealPlannerApp.register();</script>
</body>

</html>
