apiVersion: v1
kind: Service
metadata:
  name: {{ include "mealplanner.name" . }}
  labels:
    {{- include "mealplanner.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "mealplanner.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mealplanner.name" . }}
  labels:
    {{- include "mealplanner.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required when ingress is enabled." .Values.ingress.host | quote }}
      http:
        paths:
          # The app at the host's root: it serves its shell with <base href="/"> outside Home Assistant.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mealplanner.name" . }}
                port:
                  name: http
{{- end }}
---
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mealplanner.name" . }}
  labels:
    {{- include "mealplanner.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mealplanner.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # Only the ingress controller's namespace may open the port; the kubelet's probes come from the node and are not
    # subject to NetworkPolicy.
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.fromNamespaceLabels | nindent 14 }}
      ports:
        - port: http
{{- end }}
