<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Today - Warm Consumer App</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap" rel="stylesheet">
<style>
  :root { --ground: #F6F1EA; --card: #FFFFFF; --ink: #2B2622; --ink-2: #776C63; --act: #1F7A5C; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 390px; height: 844px; overflow: hidden; }
  body { background: var(--ground); color: var(--ink); font: 400 15px/1.4 'Nunito Sans', system-ui, sans-serif; position: relative; }
  .top { padding: 22px 20px 10px; display: flex; justify-content: space-between; align-items: end; }
  .top h1 { font: 800 30px/1 'Nunito Sans'; }
  .top p { font-size: 14px; color: var(--ink-2); margin-top: 6px; }
  .sync { font-size: 13px; color: var(--ink-2); }
  .card { background: var(--card); border-radius: 22px; margin: 12px 16px 0; padding: 18px; box-shadow: 0 1px 2px rgba(43,38,34,.06); }
  .card .lbl { font: 600 13px/1 'Nunito Sans'; color: var(--ink-2); }
  .card h2 { font: 800 24px/1.15 'Nunito Sans'; margin: 8px 0 12px; }
  .cta { background: var(--act); color: #fff; border: 0; border-radius: 14px; padding: 14px 18px; font: 800 15px/1 'Nunito Sans'; width: 100%; }
  .list .it { display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid #F0E9E0; }
  .list .it:first-of-type { border-top: 0; }
  .list .it b { font-weight: 600; }
  .list .it span { color: var(--ink-2); font-size: 14px; }
  nav { position: absolute; left: 0; right: 0; bottom: 0; height: 82px; background: var(--card); border-radius: 22px 22px 0 0; display: grid; grid-template-columns: repeat(5, 1fr); padding: 12px 6px 24px; box-shadow: 0 -1px 2px rgba(43,38,34,.05); }
  nav a { display: flex; flex-direction: column; align-items: center; gap: 5px; font: 600 12px/1 'Nunito Sans'; color: var(--ink-2); text-decoration: none; }
  nav a i { font-style: normal; font-size: 19px; }
  nav a.on { color: var(--act); }
</style>
</head>
<body>
  <div class="top"><div><h1>Today</h1><p>Thursday 22 October</p></div><span class="sync">Synced</span></div>
  <div class="card"><p class="lbl">Dinner tonight</p><h2>Chicken and lemon traybake</h2><button class="cta">Start cooking</button></div>
  <div class="card list">
    <div class="it"><b>Breakfast</b><span>Overnight oats</span></div>
    <div class="it"><b>Snack</b><span>Fruit and yoghurt</span></div>
    <div class="it"><b>Lunch</b><span>Leftover bolognese</span></div>
    <div class="it"><b>Snack</b><span>Cheese and crackers</span></div>
  </div>
  <div class="card"><p class="lbl">This week</p><h2>12 things to buy · $146</h2></div>
  <nav><a class="on" href="#"><i>☀</i>Today</a><a href="#"><i>▦</i>Plan</a><a href="#"><i>✓</i>Shop</a><a href="#"><i>◍</i>Meals</a><a href="#"><i>≡</i>More</a></nav>
</body>
</html>
